# The pre-deploy gate (CLAUDE.md "Deploy gate") enforced on every push instead
# of on the developer's honor (AUDIT.md §2.9). Production runs TS directly via
# tsx — nothing type-checks at startup — so this is the only automated net.
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Pin where mongodb-memory-server keeps its mongod binary so the cache
      # step below always matches (the *.db.test.ts files boot an in-memory
      # mongod; without the cache every push re-downloads ~90 MB).
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
      # config.ts fails fast on missing env vars (by design). Tests never talk
      # to real Discord/Atlas (in-memory mongod + fake interaction objects),
      # but some flow tests import game/chronicle.ts, which imports config.ts
      # at module load — so these need SOME value present, not real secrets.
      BOT_TOKEN: ci-placeholder
      CLIENT_ID: ci-placeholder
      GUILD_ID: ci-placeholder
      OWNER_ID: ci-placeholder
      MONGODB_URI: mongodb://ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-mongodb-binaries-
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
